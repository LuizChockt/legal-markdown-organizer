name: Bug report
description: Report a reproducible problem using synthetic data.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Describe the problem without private documents, tokens or personal paths.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command, synthetic input and output. Replace private paths and identifiers.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version and project version or commit.
    validations:
      required: true
