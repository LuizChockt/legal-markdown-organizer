name: Publish 0.2.0

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-0.2.0
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Check version and existing release
        id: guard
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$version" = "0.2.0" ] && ! gh release view v0.2.0 >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build wheel and source distribution from the tested commit
        if: steps.guard.outputs.publish == 'true'
        run: |
          python -m pip install build
          python -m build
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
      - name: Create immutable tag and publish release
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        run: |
          existing="$(gh api "repos/$GH_REPO/git/ref/tags/v0.2.0" --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "$existing" ]; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/v0.2.0 -f sha="$RELEASE_SHA"
          elif [ "$existing" != "$RELEASE_SHA" ]; then
            echo "Existing v0.2.0 tag points to another object; refusing to change it." >&2
            exit 1
          fi
          gh release create v0.2.0 dist/* --verify-tag --title "Legal Markdown Organizer 0.2.0" --notes-file docs/releases/v0.2.0.md
