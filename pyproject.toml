[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-markdown-organizer"
version = "0.1.0"
description = "A Markdown-first CLI for organizing legal documents by filenames and front matter."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Luiz Chockt"}]
dependencies = []
keywords = ["legal", "markdown", "obsidian", "cli", "organization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
legal-organizer = "legal_organizer.cli:main"

[tool.setuptools]
packages = ["legal_organizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
